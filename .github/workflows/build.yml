name: Build OpenWrt LiteBeam M5 TECNODANY

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Instalar dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev \
          libncursesw5-dev zlib1g-dev gawk gettext libssl-dev \
          xsltproc wget unzip python3 python3-distutils rsync \
          file subversion mercurial libelf-dev ccache device-tree-compiler

    - name: Clonar OpenWrt 24.10.4
      run: |
        git clone --depth 1 --branch v24.10.4 \
          https://github.com/openwrt/openwrt.git
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Aplicar configuracion LiteBeam M5
      run: |
        cd openwrt
        cat > .config << CONF
        CONFIG_TARGET_ath79=y
        CONFIG_TARGET_ath79_generic=y
        CONFIG_TARGET_ath79_generic_DEVICE_ubnt_nanostation-loco-m-xw=y
        CONFIG_ATH_USER_REGD=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-mod-admin-full=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_dropbear=y
        CONFIG_PACKAGE_kmod-ath9k=y
        CONFIG_PACKAGE_hostapd=y
        CONFIG_PACKAGE_wpad=y
        CONFIG_PACKAGE_wireless-regdb=y
        CONFIG_PACKAGE_iw=y
        CONFIG_PACKAGE_bridge=y
        CONFIG_PACKAGE_kmod-bridge=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_mtd=y
        CONF

    - name: Aplicar regdb frecuencias extendidas
      run: |
        cd openwrt
        mkdir -p package/firmware/wireless-regdb/files/
        printf 'country 00:\n\t(4920 - 6100 @ 80), (30), NO-CCK\n\t(4920 - 6100 @ 40), (30), NO-CCK\n\t(4920 - 6100 @ 20), (30), NO-CCK\ncountry MX:\n\t(4920 - 6100 @ 80), (30)\n\t(4920 - 6100 @ 40), (30)\n\t(4920 - 6100 @ 20), (30)\n' > package/firmware/wireless-regdb/files/regulatory.db.txt
        cat package/firmware/wireless-regdb/files/regulatory.db.txt

    - name: Parchear DTS para quitar proteccion de particion ART
      run: |
        cd openwrt

        # Buscar el DTS del dispositivo
        DTS_FILE=$(find target/linux/ath79 -name "*.dts" | xargs grep -l "nanostation-loco-m-xw\|loco-m-xw\|UBNT,XW" 2>/dev/null | head -1)
        if [ -z "$DTS_FILE" ]; then
          DTS_FILE=$(find target/linux/ath79 -name "*nanostation*loco*" 2>/dev/null | head -1)
        fi
        echo "DTS encontrado: $DTS_FILE"

        if [ -n "$DTS_FILE" ]; then
          echo "Contenido particion ART en DTS:"
          grep -n -A 5 -i "art" "$DTS_FILE"

          # Quitar readonly de la particion ART
          # Eliminar linea "read-only;" dentro del nodo art
          sed -i '/label.*=.*"art"/{n;/read-only/d}' "$DTS_FILE"
          sed -i '/art@/{n;/read-only/d}' "$DTS_FILE"

          # Buscar y eliminar read-only cerca de ART de forma mas agresiva
          python3 << 'PYEOF'
import re

dts_file = "$DTS_FILE"
with open(dts_file, 'r') as f:
    content = f.read()

# Encontrar el nodo art y quitar read-only
# Patron: nodo que contenga "art" y tenga read-only
def remove_readonly_from_art(content):
    lines = content.split('\n')
    result = []
    in_art_node = False
    brace_count = 0
    
    for i, line in enumerate(lines):
        # Detectar inicio del nodo art
        if ('label = "art"' in line or '"art"' in line or 'art@' in line.lower()):
            in_art_node = True
            brace_count = 0
        
        if in_art_node:
            brace_count += line.count('{') - line.count('}')
            # Saltar lineas read-only dentro del nodo art
            if 'read-only' in line:
                print(f"Eliminando read-only en linea {i+1}: {line}")
                continue
            if brace_count <= 0 and i > 0:
                in_art_node = False
        
        result.append(line)
    
    return '\n'.join(result)

new_content = remove_readonly_from_art(content)
with open(dts_file, 'w') as f:
    f.write(new_content)
print("DTS parcheado correctamente")
PYEOF

          echo "DTS despues del parche:"
          grep -n -A 5 -i "art" "$DTS_FILE"
        else
          echo "DTS no encontrado, buscando todos los DTS disponibles:"
          find target/linux/ath79 -name "*.dts" | head -20
        fi

    - name: Parchear regdomain AR9342
      run: |
        cd openwrt
        mkdir -p files/etc/modules.d
        mkdir -p files/etc/init.d

        echo "options ath regdomain=0" > files/etc/modules.d/ath9k-custom

        # Script que parchea la ART en cada arranque y fuerza regdomain 00
        printf '#!/bin/sh /etc/rc.common\nSTART=11\n\nstart() {\n    sleep 2\n    # Parchear regdomain en ART si aun es 08 ff\n    dd if=/dev/mtd7 of=/tmp/art_check.bin bs=1 skip=4142 count=2 2>/dev/null\n    REGDOM=$(hexdump -e '"'"'1/1 "%02x"'"'"' /tmp/art_check.bin)\n    if [ "$REGDOM" != "0000" ]; then\n        logger "Parcheando regdomain ART de $REGDOM a 0000"\n        dd if=/dev/mtd7 of=/tmp/art_patch.bin 2>/dev/null\n        printf '"'"'\\x00\\x00'"'"' | dd of=/tmp/art_patch.bin bs=1 seek=4142 count=2 conv=notrunc 2>/dev/null\n        mtd write /tmp/art_patch.bin art 2>/dev/null || dd if=/tmp/art_patch.bin of=/dev/mtd7 2>/dev/null\n        logger "ART parcheada - reiniciando"\n        reboot\n    fi\n    # Recargar driver con regdomain 0\n    rmmod ath9k 2>/dev/null\n    rmmod ath9k_common 2>/dev/null\n    rmmod ath9k_hw 2>/dev/null\n    rmmod ath 2>/dev/null\n    sleep 1\n    modprobe ath regdomain=0\n    modprobe ath9k_hw\n    modprobe ath9k_common\n    modprobe ath9k\n    sleep 1\n    iw reg set 00\n    logger "regdomain forzado a 00 mundial"\n}\n\nstop() { return 0; }\n' > files/etc/init.d/fix-regdomain
        chmod +x files/etc/init.d/fix-regdomain

        for KCONF in $(find target/linux/ath79 -name "config-*"); do
          echo "CONFIG_ATH_USER_REGD=y" >> "$KCONF"
          echo "Modificado: $KCONF"
        done

    - name: Crear archivos de configuracion
      run: |
        cd openwrt
        mkdir -p files/etc/config
        mkdir -p files/etc/init.d
        mkdir -p files/etc/uci-defaults

        printf "config wifi-device 'radio0'\n\toption type 'mac80211'\n\toption hwmode '11a'\n\toption channel '100'\n\toption country '00'\n\toption htmode 'HT20'\n\toption disabled '0'\nconfig wifi-iface 'default_radio0'\n\toption device 'radio0'\n\toption network 'lan'\n\toption mode 'ap'\n\toption ssid 'TECNODANY2026-AP'\n\toption encryption 'psk2'\n\toption key 'td1721DANY'\n" > files/etc/config/wireless

        printf "config interface 'loopback'\n\toption ifname 'lo'\n\toption proto 'static'\n\toption ipaddr '127.0.0.1'\n\toption netmask '255.0.0.0'\nconfig interface 'lan'\n\toption type 'bridge'\n\toption ifname 'eth0'\n\toption proto 'static'\n\toption ipaddr '192.168.1.1'\n\toption netmask '255.255.255.0'\nconfig interface 'wan'\n\toption ifname 'eth1'\n\toption proto 'dhcp'\n" > files/etc/config/network

        printf "config system\n\toption hostname 'LiteBeam-TECNODANY'\n\toption timezone 'CST6CDT,M3.2.0,M11.1.0'\n" > files/etc/config/system

        printf '#!/bin/sh /etc/rc.common\nSTART=99\nstart() {\n  if ! grep -q "^TECNODANY2026:" /etc/passwd; then\n    HASH=$(echo "td1721DANY" | openssl passwd -1 -stdin)\n    echo "TECNODANY2026:x:1001:1001:Admin:/home/TECNODANY2026:/bin/ash" >> /etc/passwd\n    echo "TECNODANY2026:${HASH}:19000:0:99999:7:::" >> /etc/shadow\n    mkdir -p /home/TECNODANY2026\n  fi\n}\nstop() { return 0; }\n' > files/etc/init.d/tecnodany-persist
        chmod +x files/etc/init.d/tecnodany-persist

        printf '#!/bin/sh\necho "root:td1721DANY" | chpasswd\nHASH=$(echo "td1721DANY" | openssl passwd -1 -stdin)\nif ! grep -q "^TECNODANY2026:" /etc/passwd; then\n  echo "TECNODANY2026:x:1001:1001:Admin:/home/TECNODANY2026:/bin/ash" >> /etc/passwd\n  echo "TECNODANY2026:${HASH}:19000:0:99999:7:::" >> /etc/shadow\n  mkdir -p /home/TECNODANY2026\nfi\nuci set system.@system[0].hostname=LiteBeam-TECNODANY\nuci commit system\nexit 0\n' > files/etc/uci-defaults/99-tecnodany
        chmod +x files/etc/uci-defaults/99-tecnodany

    - name: Compilar firmware
      run: |
        cd openwrt
        make defconfig
        make -j$(nproc) V=s

    - name: Subir imagen compilada
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-litebeam-m5-TECNODANY
        path: openwrt/bin/targets/ath79/generic/*.bin
        retention-days: 90
