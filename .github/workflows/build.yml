name: Build Custom LiteBeam M5 XW

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils \
            rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 --branch v23.05.5 https://git.openwrt.org/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Configuration Files
        run: |
          cd openwrt
          mkdir -p files/etc/config files/home/TECNODANY2026

          cat > files/etc/config/system <<'EOF'
          config system
              option hostname 'LiteBeam-TECNODANY'
          EOF

          cat > files/etc/passwd <<'EOF'
          TECNODANY2026:x:1000:1000:Admin:/home/TECNODANY2026:/bin/ash
          EOF

          cat > files/etc/shadow <<'EOF'
          TECNODANY2026:$1$vE8.fO1.$5N4m6G3Gk6WlXfXmP2Q5f/:19500:0:99999:7:::
          EOF

          chmod 755 files/home/TECNODANY2026

      - name: Set Target Profile
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_ath79_generic_DEVICE_ubnt_litebeam-m5-xw=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_iw-full=y
          EOF
          make defconfig

      - name: Download Sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteBeam_M5_XW_Custom
          path: openwrt/bin/targets/ath79/generic/*ubnt_litebeam-m5-xw*.bin
