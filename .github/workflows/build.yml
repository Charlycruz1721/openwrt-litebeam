name: Build OpenWrt 18.06 LiteBeam M5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          # Dependencias críticas para versiones antiguas
          sudo apt install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc wget unzip python3 python3-distutils file
          # Forzar compatibilidad de versiones antiguas de openssl
          sudo apt install -y libssl-dev

      - name: Clone OpenWrt 18.06
        run: |
          git clone -b openwrt-18.06 https://git.openwrt.org/openwrt/openwrt.git openwrt

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Firmware
        run: |
          cd openwrt
          # Configuración básica ar71xx
          echo "CONFIG_TARGET_ar71xx=y" > .config
          echo "CONFIG_TARGET_ar71xx_generic=y" >> .config
          echo "CONFIG_TARGET_ar71xx_generic_DEVICE_ubnt-lbe-m5=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          make defconfig

      # PARCHEA AHORA (Antes de compilar nada)
      - name: Hot-Patch regd.c
        run: |
          cd openwrt
          # En 18.06 el driver ath está en package/kernel/mac80211
          make package/mac80211/prepare V=s
          REGD_FILE=$(find build_dir/ -name "regd.c" | grep "ath/regd.c" | head -n 1)
          sed -i 's/return is_wrd_sku(reg->current_rd);/return true;/g' "$REGD_FILE"
          sed -i 's/if (reg->current_rd == COUNTRY_ERD_FLAG)/if (0)/g' "$REGD_FILE"
          sed -i '/^static int __ath_regd_init/,/^}/ s/return 0;/memcpy(reg->alpha2, "00", 2);\n\treg->current_rd = 0;\n\treturn 0;/g' "$REGD_FILE"

      - name: Compile
        run: |
          cd openwrt
          # El error que tenías se soluciona ejecutando con -j1 si hay problemas, 
          # pero primero intentamos con normalidad
          make -j$(nproc) || make -j1 V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-18.06-lbe-m5
          path: openwrt/bin/targets/ar71xx/generic/*sysupgrade.bin
