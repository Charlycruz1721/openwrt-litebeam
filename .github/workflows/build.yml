name: Build OpenWrt 18.06 LiteBeam M5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Contenedor con GCC antiguo para garantizar la compatibilidad con 18.06
    container: ubuntu:18.04

    steps:
      - name: Install Legacy Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc wget unzip python time file curl ca-certificates

      - name: Clone OpenWrt 18.06
        run: |
          # Clonación directa dentro del contenedor para evitar problemas de permisos de checkout
          git clone -b openwrt-18.06 https://git.openwrt.org/openwrt/openwrt.git openwrt

      - name: Update and Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Set Target Profile (ar71xx / ubnt-lbe-m5)
        run: |
          cd openwrt
          rm -f .config
          
          # Configuración específica para LiteBeam M5 en OpenWrt 18.06
          echo "CONFIG_TARGET_ar71xx=y" > .config
          echo "CONFIG_TARGET_ar71xx_generic=y" >> .config
          echo "CONFIG_TARGET_ar71xx_generic_DEVICE_ubnt-lbe-m5=y" >> .config
          
          # Paquetes adicionales
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_iw-full=y" >> .config
          
          make defconfig

   - name: Dynamic Hot-Patch for ath9k (regd.c)
        run: |
          cd openwrt
          # Preparar código fuente
          make package/mac80211/prepare V=s
          
          echo "=== DEPURACIÓN: Buscando regd.c ==="
          # Mostramos dónde está el archivo realmente
          find build_dir/ -name "regd.c"
          
          # Buscamos la ruta y la guardamos en la variable
          REGD_FILE=$(find build_dir/ -name "regd.c" | grep "ath/regd.c" | head -n 1)
          
          if [ -z "$REGD_FILE" ]; then
            echo "ERROR: No se pudo localizar regd.c automáticamente."
            exit 1
          fi

          echo "Parcheando archivo detectado en: $REGD_FILE"
          
          # Parcheo de seguridad: antes de sed, verificamos si el archivo contiene lo que buscamos
          if ! grep -q "ath_is_world_regd" "$REGD_FILE"; then
              echo "ERROR: La función ath_is_world_regd no existe en $REGD_FILE"
              exit 1
          fi

          # Modificaciones
          sed -i 's/return is_wrd_sku(reg->current_rd);/return true;/g' "$REGD_FILE"
          sed -i 's/if (reg->current_rd == COUNTRY_ERD_FLAG)/if (0)/g' "$REGD_FILE"
          sed -i '/^static int __ath_regd_init/,/^}/ s/return 0;/memcpy(reg->alpha2, "00", 2);\n\treg->current_rd = 0;\n\treturn 0;/g' "$REGD_FILE"
          
          echo "=== Parche aplicado con éxito ==="
      - name: Download Sources
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-18.06-litebeam-m5
          path: openwrt/bin/targets/ar71xx/generic/*sysupgrade.bin
