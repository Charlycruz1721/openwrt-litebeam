name: Build OpenWrt 18.06 LiteBeam M5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies + Python 2
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential gcc g++ g++-multilib \
            libncurses5-dev gawk git gettext libssl-dev xsltproc \
            wget unzip python2 python-is-python2 \
            file libelf-dev zlib1g-dev liblzma-dev subversion quilt

          # Enlaces críticos para OpenWrt 18.06
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version

      - name: Clone OpenWrt
        run: |
          git clone -b openwrt-18.06 https://git.openwrt.org/openwrt/openwrt.git openwrt

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure + Bypass Prereqs + Patch
        run: |
          cd openwrt
          
          # Configuración
          rm -f .config
          cat > .config << EOF
          CONFIG_TARGET_ar71xx=y
          CONFIG_TARGET_ar71xx_generic=y
          CONFIG_TARGET_ar71xx_generic_DEVICE_ubnt-lbe-m5=y
          CONFIG_PACKAGE_luci=y
          EOF
          
          make defconfig
          
          # Bypass fuerte de prerrequisitos
          mkdir -p staging_dir/host/stamp
          touch staging_dir/host/stamp/.prereq-build
          touch staging_dir/host/stamp/.prereq-tools
          touch staging_dir/host/stamp/.prereq-host
          
          # Preparar y parchear mac80211 (regulatory bypass)
          make package/kernel/mac80211/prepare V=s || true
          
          REGD_FILE=$(find build_dir -name regd.c | grep -E "ath/regd.c|ath9k" | head -n 1)
          if [ -n "$REGD_FILE" ]; then
            echo "Parcheando $REGD_FILE"
            cp "$REGD_FILE" "$REGD_FILE.bak"
            sed -i 's/return is_wrd_sku(reg->current_rd);/return true;/g' "$REGD_FILE"
            sed -i 's/if (reg->current_rd == COUNTRY_ERD_FLAG)/if (0)/g' "$REGD_FILE"
            sed -i '/__ath_regd_init/,+30 s/return 0;/memcpy(reg->alpha2, "00", 2);\n\treg->current_rd = 0;\n\treturn 0;/' "$REGD_FILE"
          fi

      - name: Compile
        run: |
          cd openwrt
          make -j2 FORCE=1 V=s || make -j1 FORCE=1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-18.06-lbe-m5-patched
          path: openwrt/bin/targets/ar71xx/generic/*-sysupgrade.bin
