name: Build Custom LiteBeam M5 XW

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          # Los runners de GitHub no tienen suficiente espacio libre por defecto
          # para una build completa de OpenWrt; esto evita errores de "No space left on device"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc wget unzip python3

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 --branch v23.05.5 https://git.openwrt.org/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Ath9k Frequency Patch
        run: |
          # Creamos el directorio destino en OpenWrt para los drivers atheros
          mkdir -p openwrt/package/kernel/mac80211/patches/ath/
          
          # Copiamos el parche desde la carpeta de nuestro repositorio a OpenWrt
          cp patches/999-force-world-regd.patch openwrt/package/kernel/mac80211/patches/ath/

      - name: Set Target Profile (XW Hardware)
        run: |
          cd openwrt
          echo "CONFIG_TARGET_ath79=y" > .config
          echo "CONFIG_TARGET_ath79_generic=y" >> .config
          # Perfil correcto para LiteBeam M5 (Hardware XW)
          echo "CONFIG_TARGET_ath79_generic_DEVICE_ubnt_litebeam-m5-xw=y" >> .config

          # Inclusión de LuCI y herramientas de diagnóstico
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_iw-full=y" >> .config
          make defconfig

      - name: Validate Patch Application
        run: |
          cd openwrt
          # Fuerza la preparación del paquete mac80211 para validar el parche
          make package/mac80211/{clean,prepare} V=s

      - name: Custom Configuration (Files & User)
        run: |
          cd openwrt
          mkdir -p files/etc/config
          mkdir -p files/home/TECNODANY2026

          # Configuración de sistema
          echo "config system" > files/etc/config/system
          echo "    option hostname 'LiteBeam-TECNODANY'" >> files/etc/config/system

          # Usuarios y contraseñas
          {
            echo "root:x:0:0:root:/root:/bin/ash"
            echo "TECNODANY2026:x:1000:1000:Admin:/home/TECNODANY2026:/bin/ash"
          } > files/etc/passwd

          {
            echo "root::0:0:99999:7:::"
            echo "TECNODANY2026:\$1\$vE8.fO1.\$5N4m6G3Gk6WlXfXmP2Q5f/:19500:0:99999:7:::"
          } > files/etc/shadow

          chmod 755 files/home/TECNODANY2026

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteBeam_M5_XW_Custom
          path: openwrt/bin/targets/ath79/generic/*.bin
