name: Build OpenWrt Ath79 LiteBeam M5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev libelf-dev swig libtinfo-dev

      - name: Prepare Configuration Overlay
        run: |
          # Crear estructura de carpetas para el overlay de configuración
          mkdir -p files/etc/config
          
          # Crear el archivo wireless para forzar el país 00 (World)
          cat > files/etc/config/wireless << EOF
          config wifi-device 'radio0'
                  option type 'mac80211'
                  option path 'platform/ahb/180c0000.wmac'
                  option country '00'
                  option hwmode '11a'
                  option channel 'auto'
          EOF

      - name: Clone OpenWrt
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Firmware
        run: |
          cd openwrt
          make distclean
          # 1. Buscar el nombre real del dispositivo en el código fuente
          DEVICE_ID=$(grep -l "ubnt-lbe-m5" target/linux/ath79/image/*.mk | head -n 1)
          # Si no encuentra el archivo, buscamos por el modelo en el archivo generic.mk
          if [ -z "$DEVICE_ID" ]; then
             # Listamos los dispositivos UBNT para que puedas ver el nombre real en el log
             echo "Dispositivo no encontrado con el nombre 'ubnt-lbe-m5'. Lista de posibles dispositivos UBNT:"
             grep -i "ubnt" target/linux/ath79/image/generic.mk | grep "define Device"
             exit 1
          fi
          
          # Añadir configuración y paquetes necesarios
          cat > .config << EOF
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_litebeam_m5=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_wireless-regdb=y
          CONFIG_PACKAGE_crda=y
          EOF
          
          make defconfig

      - name: Compile
        run: |
          cd openwrt
          # El sistema copiará automáticamente los archivos de la carpeta 'files'
          make -j$(nproc)

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ath79-lbe-m5-unlocked
          path: openwrt/bin/targets/ath79/generic/*-sysupgrade.bin
