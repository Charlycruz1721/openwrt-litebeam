name: Build Custom LiteBeam M5 XW

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc wget unzip python3

      # 1. Configuración de Caché para no empezar de cero
      - name: Cache OpenWrt Downloaded Sources
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ hashFiles('**/feeds.conf.default') }}
          restore-keys: |
            openwrt-dl-

      - name: Cache OpenWrt Toolchain
        uses: actions/cache@v4
        with:
          path: openwrt/staging_dir
          key: openwrt-toolchain-ath79-generic
          restore-keys: |
            openwrt-toolchain-ath79-

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 --branch v23.05.5 https://git.openwrt.org/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Set Target Profile (XW Hardware)
        run: |
          cd openwrt
          echo "CONFIG_TARGET_ath79=y" > .config
          echo "CONFIG_TARGET_ath79_generic=y" >> .config
          echo "CONFIG_TARGET_ath79_generic_DEVICE_ubnt_litebeam-m5-xw=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_iw-full=y" >> .config
          make defconfig

      # 2. Parcheo Dinámico (Reemplaza al archivo .patch)
      - name: Dynamic Hot-Patch for ath9k (regd.c)
        run: |
          cd openwrt
          # Extraemos el código fuente de los drivers mac80211 sin compilar
          make package/mac80211/prepare V=s
          
          # Buscamos la ruta exacta del archivo regd.c en esta compilación
          REGD_FILE=$(find build_dir/ -path "*/mac80211-*/ath/regd.c" | head -n 1)
          echo "Parcheando archivo en: $REGD_FILE"
          
          # Modificación 1: Hacer que ath_is_world_regd retorne true
          sed -i 's/return is_wrd_sku(reg->current_rd);/return true;/g' "$REGD_FILE"
          sed -i 's/if (reg->current_rd == COUNTRY_ERD_FLAG)/if (0)/g' "$REGD_FILE"
          
          # Modificación 2: Forzar alpha2 a "00" en __ath_regd_init
          sed -i '/^static int __ath_regd_init/,/^}/ s/return 0;/memcpy(reg->alpha2, "00", 2);\n\treg->current_rd = 0;\n\treturn 0;/g' "$REGD_FILE"

      - name: Custom Configuration (Files & User)
        run: |
          cd openwrt
          mkdir -p files/etc/config
          mkdir -p files/home/TECNODANY2026

          echo "config system" > files/etc/config/system
          echo "    option hostname 'LiteBeam-TECNODANY'" >> files/etc/config/system

          {
            echo "root:x:0:0:root:/root:/bin/ash"
            echo "TECNODANY2026:x:1000:1000:Admin:/home/TECNODANY2026:/bin/ash"
          } > files/etc/passwd

          {
            echo "root::0:0:99999:7:::"
            echo "TECNODANY2026:\$1\$vE8.fO1.\$5N4m6G3Gk6WlXfXmP2Q5f/:19500:0:99999:7:::"
          } > files/etc/shadow

          chmod 755 files/home/TECNODANY2026

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteBeam_M5_XW_Custom
          path: openwrt/bin/targets/ath79/generic/*.bin
