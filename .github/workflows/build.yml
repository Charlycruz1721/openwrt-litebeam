name: Build OpenWrt 18.06 LiteBeam M5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc \
            wget unzip python2 python3 python3-distutils python-is-python2 \
            file libelf-dev libncurses-dev libz-dev zlib1g-dev \
            bison flex subversion quilt liblzma-dev

      - name: Clone OpenWrt 18.06
        run: |
          git clone -b openwrt-18.06 https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Firmware
        run: |
          cd openwrt
          rm -f .config
          
          cat > .config << EOF
          CONFIG_TARGET_ar71xx=y
          CONFIG_TARGET_ar71xx_generic=y
          CONFIG_TARGET_ar71xx_generic_DEVICE_ubnt-lbe-m5=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          # Opcional: más paquetes útiles
          # CONFIG_PACKAGE_kmod-ath9k=y
          EOF
          
          make defconfig

      - name: Hot-Patch regd.c (Regulatory Bypass)
        run: |
          cd openwrt
          
          # Preparar el paquete mac80211
          make package/kernel/mac80211/prepare V=s || true
          
          # Buscar regd.c (ath9k en ar71xx)
          REGD_FILE=$(find build_dir -name regd.c | grep -E "ath/regd.c|ath9k" | head -n 1)
          
          if [ -n "$REGD_FILE" ]; then
            echo "Patching $REGD_FILE"
            
            # Backup
            cp "$REGD_FILE" "$REGD_FILE.bak"
            
            # Parches comunes para bypass regulatory (world / 00)
            sed -i 's/return is_wrd_sku(reg->current_rd);/return true;/g' "$REGD_FILE"
            sed -i 's/if (reg->current_rd == COUNTRY_ERD_FLAG)/if (0)/g' "$REGD_FILE"
            
            # Forzar country "00" (world) y permitir más canales/potencia
            sed -i '/__ath_regd_init/,+20 s/return 0;/memcpy(reg->alpha2, "00", 2);\n\treg->current_rd = 0;\n\treturn 0;/' "$REGD_FILE"
            
            echo "Parche aplicado correctamente"
          else
            echo "⚠️ regd.c no encontrado. Continuando sin parche..."
          fi

      - name: Compile Firmware
        run: |
          cd openwrt
          # Usamos -j1 en caso de problemas de memoria/race, pero prueba primero con paralelo
          make -j$(nproc) V=s || make -j1 V=s
          echo "Build finalizado. Archivos generados:"
          ls -la bin/targets/ar71xx/generic/

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-18.06-lbe-m5-custom
          path: openwrt/bin/targets/ar71xx/generic/*-sysupgrade.bin
          if-no-files-found: error
